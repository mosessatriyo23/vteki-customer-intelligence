name: CI/CD Pipeline & Governance Enforcement

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-security-contract:
    name: Code Quality, T-SEC-03 Allowlist & Schemathesis Contract Testing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vteki_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vteki_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/vteki_ci
      JWT_SECRET: ci-pipeline-test-jwt-secret-key-32bytes-minimum
      BOOTSTRAP_ADMIN_EMAIL: ci-admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: ci-pipeline-admin-password-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Type Checking (mypy)
        run: mypy services api worker --ignore-missing-imports

      - name: Verify Python Formatting
        run: black --check api worker migrations tests/security/test_auth.py tests/security/test_route_rbac_coverage.py tests/worker tests/data/test_snapshot_atomicity.py tests/integration/test_postgres_platform.py

      - name: Enforce T-SEC-03 Security Allowlist
        run: |
          pytest tests/security/test_allowlist.py -v

      - name: Run Unit & Integration Test Suite
        env:
          JWT_SECRET: "ci-pipeline-test-jwt-secret-key-32bytes-minimum"
          DATABASE_URL: "sqlite://"
        run: |
          pytest -v

      - name: Apply PostgreSQL Migrations
        run: alembic upgrade head

      - name: Provision least-privilege PostgreSQL role groups
        run: |
          python - <<'PY'
          import psycopg
          from pathlib import Path

          sql = Path("scripts/db_permissions.sql").read_text(encoding="utf-8")
          with psycopg.connect(
              "host=localhost dbname=vteki_ci user=postgres password=postgres",
              autocommit=True,
          ) as connection:
              connection.execute(sql, prepare=False)
          PY

      - name: Verify PostgreSQL governance, append-only audit and role isolation
        env:
          VTEKI_TEST_POSTGRES_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/vteki_ci"
        run: pytest -q tests/integration/test_postgres_platform.py

      - name: Bootstrap CI Administrator
        run: python -m api.bootstrap

      - name: Run Schemathesis API Contract Testing
        timeout-minutes: 5
        env:
          JWT_SECRET: "ci-pipeline-test-jwt-secret-key-32bytes-minimum"
          DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/vteki_ci"
        run: |
          uvicorn api.main:app --host 127.0.0.1 --port 8000 > /tmp/vteki-api.log 2>&1 &
          SERVER_PID=$!
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "=== FASTAPI ERROR LOGS ==="; if [ -f /tmp/vteki-api.log ]; then tail -n 300 /tmp/vteki-api.log; else echo "API log not found"; fi; fi; kill "$SERVER_PID" 2>/dev/null || true; exit "$rc"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          # Prove the real login endpoint works with the bootstrapped admin.
          # Random credentials from fuzzing are expected to return 401, so
          # /auth/login is excluded from fuzzing ONLY (not from the API or tests).
          token=$(python - <<'PYLOGIN'
          import json
          import os
          import urllib.request

          payload = json.dumps({
              "email": os.environ["BOOTSTRAP_ADMIN_EMAIL"],
              "password": os.environ["BOOTSTRAP_ADMIN_PASSWORD"],
          }).encode("utf-8")
          request = urllib.request.Request(
              "http://127.0.0.1:8000/auth/login",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              assert response.status == 200
              token = json.load(response)["access_token"]
          print(token)
          PYLOGIN
          )
          curl --fail --silent --show-error -H "Authorization: Bearer $token" http://127.0.0.1:8000/admin/health > /dev/null
          st run http://127.0.0.1:8000/openapi.json --checks all --max-examples 10 --max-time 30 --request-timeout 5 --exclude-path /auth/login -H "Authorization: Bearer $token"

      - name: Show FastAPI Error Logs
        if: failure()
        run: |
          echo "=== FastAPI Error Logs ==="
          if [ -f /tmp/vteki-api.log ]; then
            tail -n 300 /tmp/vteki-api.log
          else
            echo "API log file not found"
          fi
  frontend-production-build:
    name: React / Vite Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
